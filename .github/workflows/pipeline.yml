name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ap-south-1
  IMAGE_NAME: devsecops-demo

jobs:

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Scan Terraform files with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./terraform
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  build-and-scan:
    name: Build & Container Scan
    runs-on: ubuntu-latest
    needs: trivy-iac-scan
    outputs:
      scan-passed: ${{ steps.set-result.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} ./app

      - name: Scan container image with Trivy (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0
          format: json
          output: trivy-report.json

      - name: Scan container image with Trivy (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
        id: trivy-gate
        continue-on-error: true

      - name: Set scan result output
        id: set-result
        run: |
          if [ "${{ steps.trivy-gate.outcome }}" == "success" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  auto-remediate:
    name: Autonomous CVE Remediation
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: needs.build-and-scan.outputs.scan-passed == 'false'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run autonomous remediation script
        env:
          TRIVY_REPORT_PATH: trivy-report.json
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DOCKERFILE_PATH: app/Dockerfile
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/auto_remediate.py

      - name: Send remediation event to Splunk
        if: always()
        run: |
          curl -X POST "https://ingest.sg0.signalfx.com/v2/event" \
            -H "X-SF-Token: ${{ secrets.SPLUNK_HEC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '[{
              "eventType": "github.actions.auto_remediation",
              "dimensions": {
                "pipeline": "devsecops-demo",
                "branch": "${{ github.ref_name }}",
                "triggered_by": "${{ github.actor }}"
              },
              "properties": {
                "commit": "${{ github.sha }}",
                "status": "remediation_triggered",
                "timestamp": "${{ github.event.head_commit.timestamp }}"
              }
            }]'

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: needs.build-and-scan.outputs.scan-passed == 'true' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform

  log-to-splunk:
    name: Stream Logs to Splunk
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: always()
    steps:
      - name: Send pipeline result to Splunk Observability
        run: |
          curl -X POST "https://ingest.sg0.signalfx.com/v2/event" \
            -H "X-SF-Token: ${{ secrets.SPLUNK_HEC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '[{
              "eventType": "github.actions.pipeline",
              "dimensions": {
                "pipeline": "devsecops-demo",
                "branch": "${{ github.ref_name }}",
                "triggered_by": "${{ github.actor }}"
              },
              "properties": {
                "commit": "${{ github.sha }}",
                "status": "${{ job.status }}",
                "timestamp": "${{ github.event.head_commit.timestamp }}"
              }
            }]'
